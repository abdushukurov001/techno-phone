<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#141613" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d0e0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="705" rx="260" ry="22" fill="url(#pedestal)"/>

  <!-- Device graphics -->
  <g filter="url(#shadow)">
    
      <!-- Strap Top & Bottom -->
      <rect x="340" y="60" width="120" height="180" rx="16" fill="#18181b"/>
      <rect x="340" y="560" width="120" height="180" rx="16" fill="#18181b"/>

      <!-- Circular Case -->
      <circle cx="400" cy="400" r="160" fill="#475569" stroke="url(#metalLight)" stroke-width="4"/>
      <circle cx="400" cy="400" r="146" fill="#000000"/>
      <circle cx="400" cy="400" r="140" fill="#1c1917"/>

      <!-- Watch Face Ring -->
      <circle cx="400" cy="400" r="120" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="450 100"/>
      <circle cx="400" cy="400" r="100" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="380 150"/>
      <circle cx="400" cy="400" r="80" fill="none" stroke="#f43f5e" stroke-width="8" stroke-dasharray="300 200"/>

      <text x="400" y="390" text-anchor="middle" fill="#ffffff" font-size="42" font-family="-apple-system, sans-serif" font-weight="600">10:08</text>
      <text x="400" y="420" text-anchor="middle" fill="#9ca3af" font-size="14" font-family="-apple-system, sans-serif" letter-spacing="1">7,420 QADAM</text>

      <!-- Side Crown -->
      <rect x="560" y="380" width="16" height="40" rx="4" fill="#475569"/>
    
  </g>

  <!-- Product Labels -->
  <g opacity="0.88">
    <text x="400" y="742" text-anchor="middle" fill="#f3f4f6" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="2.5">HUAWEI WATCH GT 4</text>
    <text x="400" y="764" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="2">OCTAGONAL TITANIUM • 14 KUNLIK QUVVAT</text>
  </g>
</svg>