<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#141613" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d0e0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="705" rx="260" ry="22" fill="url(#pedestal)"/>

  <!-- Device graphics -->
  <g filter="url(#shadow)">
    
    <!-- Outer Metal Frame -->
    <rect x="245" y="86" width="310" height="608" rx="46" fill="#4d7c0f" stroke="url(#metalLight)" stroke-width="2"/>
    <!-- Antenna bands -->
    <rect x="243" y="180" width="3" height="6" fill="#111827" opacity="0.6"/>
    <rect x="554" y="180" width="3" height="6" fill="#111827" opacity="0.6"/>
    <rect x="243" y="580" width="3" height="6" fill="#111827" opacity="0.6"/>
    <rect x="554" y="580" width="3" height="6" fill="#111827" opacity="0.6"/>

    <!-- Screen Bezel -->
    <rect x="251" y="92" width="298" height="596" rx="42" fill="#050607"/>

    <!-- Screen Glass & Wallpaper -->
    <g>
      <clipPath id="screenClip-ktczp">
        <rect x="255" y="96" width="290" height="588" rx="38"/>
      </clipPath>
      <rect x="255" y="96" width="290" height="588" rx="38" fill="linear-gradient(135deg, #14532d 0%, #65a30d 50%, #052e16 100%)"/>
      
      <!-- Abstract Wallpaper shapes -->
      <circle cx="380" cy="380" r="140" fill="#ffffff" opacity="0.08" filter="blur(20px)"/>
      <circle cx="440" cy="420" r="110" fill="#000000" opacity="0.25"/>

      <!-- Clock & Status Bar -->
      <text x="400" y="220" text-anchor="middle" fill="#ffffff" font-size="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="200" opacity="0.95">10:08</text>
      <text x="400" y="250" text-anchor="middle" fill="#e5e7eb" font-size="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" opacity="0.8">Seshanba, 3-noyabr</text>
      
      <!-- Home Indicator bar -->
      <rect x="350" y="668" width="100" height="4" rx="2" fill="#ffffff" opacity="0.6"/>

      <!-- Camera Notch / Island -->
      <circle cx="400" cy="110" r="7" fill="#000000"/>
      <circle cx="400" cy="110" r="3" fill="#1e3a8a"/>
    </g>

    <!-- Glass gloss reflection -->
    <path d="M 255 96 L 460 96 L 255 420 Z" fill="#ffffff" opacity="0.04"/>
  
  </g>

  <!-- Product Labels -->
  <g opacity="0.88">
    <text x="400" y="742" text-anchor="middle" fill="#f3f4f6" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="2.5">SAMSUNG GALAXY A54</text>
    <text x="400" y="764" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="2">AWESOME LIME • 120HZ SUPER AMOLED</text>
  </g>
</svg>