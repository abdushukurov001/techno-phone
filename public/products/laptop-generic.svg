<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#141613" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d0e0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="705" rx="260" ry="22" fill="url(#pedestal)"/>

  <!-- Device graphics -->
  <g filter="url(#shadow)">
    
    <!-- Display Lid (Angled) -->
    <rect x="140" y="120" width="520" height="360" rx="16" fill="#374151" stroke="url(#metalLight)" stroke-width="2"/>
    <rect x="156" y="136" width="488" height="328" rx="8" fill="#000000"/>
    
    <!-- Screen Wallpaper -->
    <rect x="160" y="140" width="480" height="320" rx="6" fill="linear-gradient(135deg, #090e17 0%, #312e81 50%, #030712 100%)"/>
    <!-- Menu Bar -->
    <rect x="160" y="140" width="480" height="18" fill="rgba(0,0,0,0.5)"/>
    <circle cx="172" cy="149" r="3" fill="#ef4444"/>
    <circle cx="182" cy="149" r="3" fill="#eab308"/>
    <circle cx="192" cy="149" r="3" fill="#22c55e"/>

    <!-- Display WebCam -->
    <circle cx="400" cy="148" r="3" fill="#111827"/>
    <circle cx="400" cy="148" r="1" fill="#38bdf8"/>

    <!-- Laptop Base / Keyboard deck (Perspective projection) -->
    <polygon points="100,520 700,520 740,640 60,640" fill="#1f2937" stroke="url(#metalLight)" stroke-width="1.5"/>
    
    <!-- Keyboard Wells -->
    <polygon points="160,530 640,530 665,600 135,600" fill="#090a0f"/>
    <!-- Key rows illusion -->
    <line x1="160" y1="544" x2="640" y2="544" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="152" y1="558" x2="648" y2="558" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="144" y1="572" x2="656" y2="572" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="136" y1="586" x2="664" y2="586" stroke="#1f2937" stroke-width="1.5"/>

    

    <!-- Trackpad -->
    <polygon points="330,608 470,608 480,634 320,634" fill="#17191e" stroke="rgba(255,255,255,0.08)"/>

    <!-- Front Lip Notch -->
    <rect x="360" y="638" width="80" height="4" rx="2" fill="#374151"/>
  
  </g>

  <!-- Product Labels -->
  <g opacity="0.88">
    <text x="400" y="742" text-anchor="middle" fill="#f3f4f6" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="2.5">NOUTBUK</text>
    <text x="400" y="764" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="2">ISH VA O'QISH UCHUN NOUTBUK</text>
  </g>
</svg>