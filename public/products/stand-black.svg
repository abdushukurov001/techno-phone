<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#141613" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d0e0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="705" rx="260" ry="22" fill="url(#pedestal)"/>

  <!-- Device graphics -->
  <g filter="url(#shadow)">
    
      <!-- Stand Angle -->
      <polygon points="200,540 600,540 560,320 240,320" fill="#18181b" stroke="url(#metalLight)" stroke-width="2"/>
      <polygon points="240,560 560,560 540,540 260,540" fill="#090a0f"/>
      <rect x="220" y="520" width="60" height="30" rx="6" fill="#38bdf8" opacity="0.6"/>
      <rect x="520" y="520" width="60" height="30" rx="6" fill="#38bdf8" opacity="0.6"/>
    
  </g>

  <!-- Product Labels -->
  <g opacity="0.88">
    <text x="400" y="742" text-anchor="middle" fill="#f3f4f6" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="2.5">ALYUMINIY NOUTBUK STENDI (QORA)</text>
    <text x="400" y="764" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="2">ERGONOMIK BALANDLIK & SOVUTISH</text>
  </g>
</svg>