<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#141613" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d0e0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="705" rx="260" ry="22" fill="url(#pedestal)"/>

  <!-- Device graphics -->
  <g filter="url(#shadow)">
    
      <!-- Charger Block -->
      <rect x="280" y="240" width="240" height="280" rx="36" fill="#1e293b" stroke="url(#metalLight)" stroke-width="3"/>
      <!-- Prongs -->
      <rect x="340" y="170" width="22" height="70" rx="8" fill="#94a3b8"/>
      <rect x="438" y="170" width="22" height="70" rx="8" fill="#94a3b8"/>

      <!-- USB-C Ports -->
      <rect x="350" y="440" width="100" height="24" rx="12" fill="#090a0f" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="400" y="457" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">65W GaN</text>
    
  </g>

  <!-- Product Labels -->
  <g opacity="0.88">
    <text x="400" y="742" text-anchor="middle" fill="#f3f4f6" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="2.5">DUAL PORT 35W QUVVATLAGICH</text>
    <text x="400" y="764" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="2">BIR VAQTDA 2 TA QURILMA ZARYADLASH</text>
  </g>
</svg>