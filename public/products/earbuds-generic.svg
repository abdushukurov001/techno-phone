<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#141613" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d0e0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="705" rx="260" ry="22" fill="url(#pedestal)"/>

  <!-- Device graphics -->
  <g filter="url(#shadow)">
    
    <!-- Charging Case Open -->
    <rect x="280" y="280" width="240" height="260" rx="68" fill="#f8fafc" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    <line x1="280" y1="370" x2="520" y2="370" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
    <circle cx="400" cy="420" r="4" fill="#22c55e"/>

    <!-- Left Earbud floating -->
    <g transform="translate(240, 150) rotate(-15)">
      <rect x="0" y="24" width="20" height="56" rx="10" fill="#f8fafc"/>
      <circle cx="10" cy="20" r="24" fill="#f8fafc"/>
      <circle cx="22" cy="16" r="14" fill="#e5e7eb"/>
      <circle cx="4" cy="18" r="5" fill="#1f2937"/>
    </g>

    <!-- Right Earbud floating -->
    <g transform="translate(520, 150) rotate(15)">
      <rect x="0" y="24" width="20" height="56" rx="10" fill="#f8fafc"/>
      <circle cx="10" cy="20" r="24" fill="#f8fafc"/>
      <circle cx="-2" cy="16" r="14" fill="#e5e7eb"/>
      <circle cx="16" cy="18" r="5" fill="#1f2937"/>
    </g>
  
  </g>

  <!-- Product Labels -->
  <g opacity="0.88">
    <text x="400" y="742" text-anchor="middle" fill="#f3f4f6" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="2.5">QULOQCHINLAR</text>
    <text x="400" y="764" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="2">SIMSIZ TWS QULOQCHINLAR</text>
  </g>
</svg>