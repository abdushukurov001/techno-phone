<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#848079" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#141613" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d0e0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="705" rx="260" ry="22" fill="url(#pedestal)"/>

  <!-- Device graphics -->
  <g filter="url(#shadow)">
    
    <!-- Outer Metal Frame -->
    <rect x="245" y="86" width="310" height="608" rx="46" fill="#848079" stroke="url(#metalLight)" stroke-width="2"/>
    <!-- Back Matte Glass Panel -->
    <rect x="250" y="91" width="300" height="598" rx="42" fill="#53504c"/>
    
    <!-- Camera System -->
    
      <rect x="268" y="108" width="112" height="118" rx="26" fill="#53504c" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.3))"/>
      <!-- Lenses -->
      <circle cx="304" cy="142" r="20" fill="#090a0f" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <circle cx="304" cy="142" r="10" fill="#0f172a"/>
      <circle cx="304" cy="142" r="4" fill="#38bdf8" opacity="0.8"/>

      <circle cx="304" cy="192" r="20" fill="#090a0f" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <circle cx="304" cy="192" r="10" fill="#0f172a"/>
      <circle cx="304" cy="192" r="4" fill="#38bdf8" opacity="0.8"/>

      <circle cx="348" cy="167" r="20" fill="#090a0f" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <circle cx="348" cy="167" r="10" fill="#0f172a"/>
      <circle cx="348" cy="167" r="4" fill="#38bdf8" opacity="0.8"/>

      <!-- LiDAR & Flash -->
      <circle cx="350" cy="128" r="7" fill="#fef08a" opacity="0.8"/>
      <circle cx="328" cy="204" r="6" fill="#1e293b"/>
    

    <!-- Brand emblem / subtle logo -->
    <circle cx="400" cy="400" r="18" fill="rgba(255,255,255,0.08)"/>

    <!-- Glass sheen -->
    <path d="M 250 91 L 430 91 L 250 450 Z" fill="#ffffff" opacity="0.03"/>
  
  </g>

  <!-- Product Labels -->
  <g opacity="0.88">
    <text x="400" y="742" text-anchor="middle" fill="#f3f4f6" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="2.5">APPLE IPHONE 15 PRO (ORQA)</text>
    <text x="400" y="764" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="2">TRIPLE 48MP KAMERA • TITAN KORPUS</text>
  </g>
</svg>