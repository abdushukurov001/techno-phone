<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#141613" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d0e0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="400" cy="705" rx="260" ry="22" fill="url(#pedestal)"/>

  <!-- Device graphics -->
  <g filter="url(#shadow)">
    
    <!-- Sport Strap Top & Bottom -->
    <rect x="330" y="50" width="140" height="200" rx="20" fill="#18181b"/>
    <rect x="330" y="550" width="140" height="200" rx="20" fill="#18181b"/>

    <!-- Squircle Case -->
    <rect x="270" y="240" width="260" height="320" rx="64" fill="#18181b" stroke="url(#metalLight)" stroke-width="4"/>
    <rect x="282" y="252" width="236" height="296" rx="52" fill="#000000"/>
    <rect x="288" y="258" width="224" height="284" rx="48" fill="#09090b"/>

    <!-- Activity Rings -->
    <circle cx="400" cy="400" r="85" fill="none" stroke="#fa2d48" stroke-width="12" stroke-linecap="round" stroke-dasharray="420 120"/>
    <circle cx="400" cy="400" r="65" fill="none" stroke="#92e32b" stroke-width="12" stroke-linecap="round" stroke-dasharray="320 100"/>
    <circle cx="400" cy="400" r="45" fill="none" stroke="#1de5d4" stroke-width="12" stroke-linecap="round" stroke-dasharray="240 80"/>

    <text x="400" y="315" text-anchor="middle" fill="#ffffff" font-size="28" font-family="-apple-system, sans-serif" font-weight="600">09:41</text>

    <!-- Digital Crown & Button -->
    <rect x="530" y="300" width="16" height="56" rx="6" fill="#3f3f46" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="530" y="390" width="12" height="60" rx="4" fill="#3f3f46"/>
  
  </g>

  <!-- Product Labels -->
  <g opacity="0.88">
    <text x="400" y="742" text-anchor="middle" fill="#f3f4f6" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="2.5">APPLE WATCH SERIES 8 45MM</text>
    <text x="400" y="764" text-anchor="middle" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="2">MIDNIGHT • EKG & HARORAT SENSORI</text>
  </g>
</svg>